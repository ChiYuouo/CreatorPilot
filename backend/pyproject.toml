[project]
name = "creatorpilot-backend"
version = "1.0.0"
description = "CreatorPilot backend - AI content operations automation platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "starlette>=0.39",  # FileResponse 的 HTTP Range 支持
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "httpx>=0.27",
    "openai>=1.40",
    "langgraph>=1.2",
    "celery[redis]>=5.6,<6",
    "python-multipart>=0.0.9",
    "Pillow>=11.0",
    "tzdata>=2024.1",  # Windows 下的时区数据，供每周任务计算运行时间
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
